services:
  postgres:
    image: postgres:17
    container_name: kokorono-note-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: kokorono_note
      POSTGRES_USER: kokorono_note
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}

    ports:
      - "5432:5432"

    volumes:
      - kokorono_note_postgres_data:/var/lib/postgresql/data

volumes:
  kokorono_note_postgres_data: